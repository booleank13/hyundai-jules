<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyundai IONIQ 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ad-container">
        <!-- Logo (Always on top) -->
        <div class="logo-container">
            <!-- Using SVG for Hyundai Logo Shape -->
            <svg class="logo-svg" viewBox="0 0 300 50" xmlns="http://www.w3.org/2000/svg">
                <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="#002c5f" font-style="italic">HYUNDAI</text>
            </svg>
        </div>

        <!-- Scene 1: Game (Chase) -->
        <div id="scene-game" class="scene active">
            <div id="hint-text">YAKALA BENİ!</div>
            <div id="car-container">
                <img src="assets/car.png" id="car" alt="Hyundai IONIQ 6">
            </div>
        </div>

        <!-- Scene 2: Message 1 -->
        <div id="scene-msg1" class="scene">
            <div class="message-content">
                <p class="big-text">Sen beni yakalayana kadar ben <span class="highlight">%80</span> şarj oldum</p>
            </div>
            <div class="car-static-wrapper">
                 <img src="assets/car.png" class="car-static" alt="Hyundai IONIQ 6">
            </div>
        </div>

        <!-- Scene 3: Message 2 (End Card) -->
        <div id="scene-end" class="scene">
            <div class="message-content">
                <h1 class="model-name">IONIQ 6</h1>
                <p class="info-text">%10'dan %80'e <br><span class="highlight-blue">15 dk</span> şarj oluyor.</p>
                <a href="https://www.hyundai.com/tr/tr/arac-satis/hyundainizi-olusturun/modeller" target="_blank" class="cta-button">KEŞFET</a>
            </div>
             <div class="car-static-wrapper-end">
                 <img src="assets/car.png" class="car-static-end" alt="Hyundai IONIQ 6">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
